<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecommerce-Admin Panel</title>
       <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"/>
      <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container admin-wrapper py-4 py-lg-5">
      <div class="form-card">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <h2 class="page-title mb-1">Product List</h2>
            <div class="text-muted small">Manage your products easily</div>
          </div>
        </div>
        <div class="row g-3">
          <div class="col-12 col-md-6 col-lg-4">
            <label class="form-label-custom">Product Name</label>
        <input
          id="input-name"
          type="text"
          class="form-control"
          placeholder="Product Name.."
        />
        <input
          id="input-category"
          type="text"
          class="form-control"
          placeholder="Category"
        />
        <input
          id="input-price"
          type="text"
          class="form-control"
          placeholder="Price"
        />
        <input
          id="input-discount"
          type="text"
          class="form-control"
          placeholder="Discount"
        />
        <input
          id="input-description"
          type="text"
          class="form-control"
          placeholder="Description"
        />
        <input
          id="input-rating"
          type="text"
          class="form-control"
          placeholder="Rating"
        />
        <input
          id="input-image"
          type="text"
          class="form-control"
          placeholder="Product URL"
        />

          </div>

          <div class="col-12 d-flex gap-2 pt-2">
        <button id="add-product-btn" class="btn btn-primary main-action px-4">
          Add Product
        </button>
        <button id="edit-product-btn" class="btn btn-warning d-none main-action px-4">
          Edit Product
        </button>
          </div>
        </div>
      </div>

    <div class="section-space">
    <div class="filter-card">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
        <div>
          <div class="filter-title mb-1">Product Filters</div>
          <div class="text-muted small">Search, filter by category and sort by price</div>
        </div>
      </div>

      <div class="row g-3 align-items-center justify-content-center">
        <div class="col-12 col-lg-7">
          <div class="search-group">
            <input
              id="input-search"
              type="text"
              placeholder="search here.."
              class="form-control"
            />
            <button id="search-btn" class="btn btn-primary main-action px-4">Search</button>
            <button id="reset-btn" class="btn btn-warning main-action px-4">Reset</button>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-3">
          <div class="dropdown">
            <a
              class="form-control dropdown-toggle border border-1 border-secondary px-3 py-2 rounded text-decoration-none text-muted category-button"
              href="#"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false">
              All Products
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Foods</a></li>
              <li><a class="dropdown-item" href="#">Clothes</a></li>
              <li><a class="dropdown-item" href="#">Grocery</a></li>
              <li><a class="dropdown-item" href="#">Beauty</a></li>
              <li><a class="dropdown-item" href="#">Vegetables</a></li>
              <li><a class="dropdown-item" href="#">Fruits</a></li>
              <li><a class="dropdown-item" href="#">Electronics</a></li>
            </ul>
          </div>
        </div>
        <div class="col-12 col-md-6 col-lg-2">
          <select class="form-select" name="" id="price-filter">
            <option value="default" class="text-decoration-none text-muted">Default</option>
            <option value="maximum price">Higher to Lower</option>
            <option value="minimum price">Lower to Higher</option>
          </select>
        </div>
      </div>
    </div>
    </div>

    <div class="section-space table-card">
      <div class="table-responsive">
      <table class="table product-table">
        <thead>
    <tr>
        <th>Preview</th>
        <th>Product Name</th>
        <th>Category</th>
        <th>Description</th>
        <th>Price</th>
        <th>Discount</th>
        <th>Rating</th>
        <th class="text-center">Action</th>
    </tr>
</thead>
        <tbody id="product-tbody"></tbody>
      </table>
      </div>
    </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js
    "integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"crossorigin="anonymous"
    ></script>
  </body>
</html>
