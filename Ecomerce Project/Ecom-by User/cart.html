<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, initial-scale=1.0">
    <title>Ecom-User Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"crossorigin="anonymous">
</head>

<body>

<!-- 1. search bar for cart products :- -->
<nav class="navbar bg-body-tertiary mb-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold">Ecom-User Cart</a>
    <form class="d-flex" role="search" id="cart-search-form">
      <input class="form-control me-2"type="search"placeholder="Search Product"aria-label="Search Product"id="cart-search-input">

      <button class="btn btn-outline-success" type="submit"title="Search">
        <i class="bi bi-search"></i>
      </button>
    </form>
  </div>
</nav>

    <!--Cart Section-->
    <section class="container-fluid">
        <div id="cart-container" class="container d-flex flex-column align-items-center"></div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="cart.js"></script>
</body>

</html>
