<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>*Area of Square*</h1>

<script>
    let side = 15;

    let area = side * side;

    document.writeln("<h2>Area of Square:-</h2>");
    document.writeln("Side = " + side + "<br>");
    document.writeln("Area = " + area);

</script>
</body>
