<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>

// Swapping without Third Variable using function.

function swap(a, b)
{
    console.log("Before Swapping");
    console.log("a =", a);
    console.log("b =", b);

// Swapping formula
    a = a + b;
    b = a - b;
    a = a - b;

    console.log("After Swapping");
    console.log("a =", a);
    console.log("b =", b);
}

swap(10, 20);

</script>
</body>
</html>
