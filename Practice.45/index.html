<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<script>

// wap to find area of Circle using function.

function AreaOfCircle(radius)
{
    let area = 3.14 * radius * radius;

    document.writeln("<h2>Area of Circle:-</h2>");
    document.writeln("Radius = " + radius + "<br>");
    document.writeln("Area of Circle = " + area);
}

// Function Call
AreaOfCircle(25);

</script>

</body>
</html>
