<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<script>

// wap to find area of Triangle using function.

function areaOfTriangle(base, height)
{
    let area = (base * height) / 2;

    document.writeln("<h2>Area of Triangle:-</h2>");
    document.writeln("Base = " + base + "<br>");
    document.writeln("Height = " + height + "<br>");
    document.writeln("Area of Triangle = " + area);
}

// Function Call
areaOfTriangle(15, 20);


</script>

</body>
</html>
