<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

<script>

// wap to find area of rectangle using function.

function areaOfrectangle(length, width)
{
    let area = length * width;

    document.writeln("<h2>Area of Rectangle:-</h2>");
    document.writeln("Length = " + length + "<br>");
    document.writeln("Width = " + width + "<br>");
    document.writeln("Area Of Rectangle= " + area);
}

// function call
areaOfrectangle(45, 65);

</script>
    
</body>
</html>
