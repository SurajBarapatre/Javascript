<body>
<script>

// wap to find area of square using funtion.

function areaofSquare(side)
{
    let area = side * side;

    document.writeln("<h2>Area of Square:-</h2>");
    document.writeln("Side = " + side + "<br>");
    document.writeln("Area = " + area);

}

areaofSquare(15);

</script>
