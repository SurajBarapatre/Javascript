<script>

// wap to wap to find sum of 1 to n using function.

function findSum(n)
{
    let sum = (n * (n + 1)) / 2;

    document.writeln("The sum of 1 to " + n + " is: " + sum);
}

// Function Call
findSum(15);

</script>
