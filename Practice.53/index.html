<script>

// wap to check given number is divisible by 7 or not using function.

function divisible(number)
{
    if (number % 7 == 0) 
    {
        console.log(number + " is divisible by 7.");
    } else 
    {
        console.log(number + " is not divisible by 7.");
    }
}

// function call
    divisible(42);


</script>
