<script>

// wap to check number is negetive, positive or neutral using function.

function checknumber(num)
{
    if(num > 0)
    {
        console.log("Number is Positive !");

    }else if(num < 0)
    {
        console.log("Number is Negetive !");
    }
    else
    {
        console.log("Number is Neutral !");
    }
}

// function call

checknumber(28);

</script>
