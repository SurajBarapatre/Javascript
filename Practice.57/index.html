<script>

// wap to check number is even or not using if else without % using function.

function EvenNumber(num) 
{
    if (Math.floor(num / 2) * 2 == num) 
    {
    console.log(num + " is Even Number !");
    } 
    else 
    {
    console.log(num + " is Odd Number !");
    }
}

// function call
EvenNumber(28);

</script>
