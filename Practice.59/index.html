<script>

// wap to find max number from two numbers using nested if else using function.

function MaxNumber(A, B) 
{
    if (A > B) 
{
    console.log("A is maximum number");
}
else 
{
    if (A < B) 
    {
        console.log("B is maximum number");
    }
    else 
    {
        console.log("Both numbers are equal");
    } 
}      
}

//function call
MaxNumber(45, 25);

</script>
