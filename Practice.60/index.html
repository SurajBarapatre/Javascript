<script>

// wap to find max numbers from three numbers using nested if else using function.

function MaxNumber(A, B, C) 
{
    if (A > B) 
{
    if (A > C) 
    {
        console.log("A is the maximum number");
    } else 
    {
        console.log("C is the maximum number");
    }
} else 

{
    if (B > C) 
    {
        console.log("B is the maximum number");
    } else 
    {
        console.log("C is the maximum number");
    }
}
}

//function call
MaxNumber(45,20,13);

</script>
