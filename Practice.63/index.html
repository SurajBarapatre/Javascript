<script>

// wap to print only even numbers from 10 to 1 using while loop and function.

function EvenNumbers(params) 
{
    let num = 10;

while (num >= 1) 
    {
    if (num % 2 == 0)

    }
    num--;
}
}

// function call
EvenNumbers();
