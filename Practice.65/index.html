<script>

// wap to print only odd numbers from 1 to n using function.

function OddNumbers()
{

let n = 10; 
let i = 1;

while (i <= n) 
    {
    if (i % 2 !== 0) 
    {
        console.log(i);
    }
    i++;
}
}

//function call
OddNumbers();

</script>
