<script>

// wap to find sum of 1 to n using while loop and function.

function sum() 
{

    let n = 15;
    let sum = 0;
    let i = 1;

while (i <= n) 
{
    sum += i;
    i++;
}

console.log("Sum of 1 to " + n + " is: " + sum);
}

// function call
sum();

</script>
