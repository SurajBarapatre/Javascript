<script>

// wap to print only even numbers from 10 to 1 using do-while loop and function.

function EvenNumbers() 
{
    let num = 10;

do {
    if (num % 2 == 0) 
    {
        console.log(num);
    }
    num--;
}
 while (num >= 1);
}

// function call
EvenNumbers();

</script>
