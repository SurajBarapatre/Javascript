<script>

// find sum of even numbers from 1 to n using for loop and function.

function SumOfevenNumbers() 
{
    let n = 10;
    let sum = 0;

    for (let i = 1; i <= n; i++) 
{
    if (i % 2 == 0) 
    {
        sum += i;
    }
}
console.log(sum);
}

//function call
SumOfevenNumbers();

</script>
