<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz App - KBC</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <section class="container-fluid">
      <div class="container">
        <h1 class="my-3 text-bold ">Kaun Banega Crorepati</h1>
        <div class="d-flex justify-content-center">
          <h2
            id="timer-count"
            class="border border-success border-3 p-3 rounded"
          >
        60
          </h2>
        </div>
        <div class="my-4 fs-5">
          <p>
            <span id="question-index">Q.1</span>
            <span id="question"
              >Lorem ipsum dolor sit amet, consectetur adipisicing elit.
              Maxime?</span
            >
          </p>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id="option-a-btn"
            />
            <label
              id="option-a-text"
              class="form-check-label"
              for="radioDefault1"
            >
              Default radio
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id="option-b-btn"
            />
            <label
              id="option-b-text"
              class="form-check-label"
              for="radioDefault1"
            >
              Default radio
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id=" option-c-btn"
            />
            <label
              id="option-c-text"
              class="form-check-label"
              for="radioDefault1"
            >
              Default radio
            </label>
          </div>
          <div class="form-check">
            <input
              class="form-check-input"
              type="radio"
              name="radioDefault"
              id=" option-d-btn"
            />
            <label
              id="option-d-text"
              class="form-check-label"
              for="radioDefault1"
            >
              Default radio
            </label>
          </div>
          <div class="my-3">
            <button id="next-question-btn" class="btn btn-primary">Next</button>
          </div>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
