<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"content="width=device-width, initial-scale=1.0">
<title>Random Quiz App</title>
    <!-- Bootstrap Link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"rel="stylesheet">
</head>

<!-- Display Screen-->
<body class="bg-light">
    <div class="container py-5">
        <div id="start-screen"
            class="text-center">
            <h1 class="mb-3">
            Random Quiz App
            </h1>
            <p>
            10 Random MCQ Questions
            </p>

            <button
                id="start-btn"
                class="btn btn-primary btn-lg">
                Start Quiz
            </button>
        </div>

        <!-- Quiz box Section-->
    <div id="quiz-box"class="card shadow mx-auto p-4 d-none"style="max-width: 750px;">
            <!-- Top Line section-->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <span id="question-number"class="badge bg-primary fs-6">
            Question 1 / 10
        </span>
        <span id="timer"class="badge bg-danger fs-6">
            60
        </span>
    </div>

    <!-- questions-->
     <h3 id="question"class="mb-4">Question</h3>
    <!-- Options-->
    <div id="options">
    </div>
    <!-- Buttons -->
    <div class="d-flex justify-content-between mt-4">
        <button id="previous-btn"class="btn btn-warning">
        Previous
        </button>
        <button id="next-btn"class="btn btn-primary">
        Next
        </button>
        <button id="submit-btn"class="btn btn-success d-none">
        Submit Quiz
        </button>
    </div>
    </div>
        <!-- Result section-->
    <div id="result-box"class="card shadow mx-auto p-5 text-center d-none"style="max-width: 750px;">
        <h2 class="text-success">Quiz Completed!</h2>
        <hr>
        <h3 id="score"></h3>
        <h4 id="percentage"></h4>
        <h3 id="result-message"class="mt-4"></h3>
        <button id="restart-btn"class="btn btn-primary mt-4">
        Restart Quiz
        </button>
    </div>
    </div>
    <!--javascript Link-->
    <script src="script.js"></script>
</body>
</html>
