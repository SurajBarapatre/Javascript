<body>
<script>

    // wap to check number is even or not using if else without using %

    let num = 28;

    if (Math.floor(num / 2) * 2 == num) 
    {
    console.log(num + " is Even Number !");
    } 
    else 
    {
    console.log(num + " is Odd Number !");
    }
</script>
