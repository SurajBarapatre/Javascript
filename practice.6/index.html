<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>*Area of Triangle*</h1>

<script>

    let base = 15;
    let height =20;

    let area = (base * height) / 2;

    document.writeln("<h2>Area of Triangle:-</h2>");
    document.writeln("Base = " + base + "<br>");
    document.writeln("Height = " + height + "<br>");
    document.writeln("Area of Triangle = " + area);

</script>
</body>
</html>
