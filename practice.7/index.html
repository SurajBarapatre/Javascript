<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>*Area Of Rectangle*</h1>
    
<script>
    let length = 45;
    let width = 65;

    let area = length * width;

    document.writeln("<h2>Area of Rectangle:-</h2>");
    document.writeln("Length = " + length + "<br>");
    document.writeln("Width = " + width + "<br>");
    document.writeln("Area Of Rectangle= " + area);

</script>
</body>
</html>
